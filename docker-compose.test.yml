name: chimeway-test

services:
  postgres:
    image: postgres:16-alpine
    network_mode: bridge
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:${CHIMEWAY_TEST_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - chimeway-test-postgres:/var/lib/postgresql/data

volumes:
  chimeway-test-postgres:
