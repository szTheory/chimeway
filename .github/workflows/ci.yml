name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    # Dispatched by release.yml when a Release PR is open but bot pushes skip pull_request CI.
    # On-demand nightly tier (cold build, full OTP matrix, 1.17 floor, verify_admin) without
    # waiting for the 07:00 UTC cron:
    #   gh workflow run ci.yml --ref <branch> -f run_nightly=true
    inputs:
      run_nightly:
        description: "Run the nightly tier on this dispatch (cold build, full OTP matrix, 1.17 floor, verify_admin)."
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Uniform Postgres credentials for every lane. Partner TestRepos
# (Mailglass/Accrue/Threadline/Sigra) derive their user/password from these
# PG* vars; lanes that set only DATABASE_URL previously left partner repos
# without credentials (username fell through to the runner's USER, password
# to nil), which failed on a clean CI run. Job-level env still overrides.
env:
  PGUSER: postgres
  PGPASSWORD: postgres
  PGHOST: localhost

# Least-privilege GITHUB_TOKEN default (QUAL-03, D-07): every job inherits
# read-only contents access. Jobs that call scripts/ci/obs-summary.sh (which
# queries `gh api .../jobs` for CI-run timing) escalate at the job level to
# add `actions: read`. A job-level `permissions:` block REPLACES this
# top-level default rather than merging with it, so every escalating job
# below re-declares `contents: read` alongside `actions: read` (D-08/D-09).
permissions:
  contents: read

jobs:
  resolve_tiers:
    name: Resolve tier flags
    runs-on: ubuntu-latest
    outputs:
      run_nightly: ${{ steps.flags.outputs.run_nightly }}
      otp_matrix: ${{ steps.flags.outputs.otp_matrix }}
      run_floor: ${{ steps.flags.outputs.run_floor }}
    steps:
      - id: flags
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'otp_matrix=["27"]' >>"$GITHUB_OUTPUT"
          else
            echo 'otp_matrix=["26","27"]' >>"$GITHUB_OUTPUT"
          fi

          if [ "${{ github.event_name }}" = "schedule" ] || \
             { [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
               [ "${{ github.event.inputs.run_nightly }}" = "true" ]; }; then
            echo "run_nightly=true" >>"$GITHUB_OUTPUT"
          else
            echo "run_nightly=false" >>"$GITHUB_OUTPUT"
          fi

          # QUAL-05/D-14/D-15: the 1.17 floor must run AND gate on every event
          # where ci-gate itself runs (`always() && github.event_name !=
          # 'pull_request'`), so run_floor mirrors that exact condition. This
          # keeps the floor's result out of `skipped` whenever ci-gate
          # evaluates it (Pitfall 2) — never true on pull_request.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run_floor=true" >>"$GITHUB_OUTPUT"
          else
            echo "run_floor=false" >>"$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache_main
        with:
          path: |
            deps
            _build
          key: build-test-lint-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            build-test-lint-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
      - run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      - name: Compile (instrumented — deps then app)
        shell: bash
        run: scripts/ci/obs-recompile.sh
      - run: mix ci.lint
      # Dependency advisory audit is ADVISORY-ONLY: it runs and surfaces new
      # advisories in the logs, but does not fail the gate. Blocking on
      # externally-disclosed CVEs with no upstream fix would wedge the entire
      # merge pipeline (lint feeds pr-gate). Accepted-risk advisories are
      # tracked in SECURITY.md; revisit when upstream patches ship.
      - name: Dependency advisory audit (advisory-only)
        run: mix ci.audit
        continue-on-error: true
      - name: CI observability summary
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          CACHE_MAIN_HIT: ${{ steps.cache_main.outputs.cache-hit }}
          CACHE_MAIN_MATCHED: ${{ steps.cache_main.outputs.cache-matched-key }}
          CACHE_MAIN_PRIMARY: ${{ steps.cache_main.outputs.cache-primary-key }}
        run: scripts/ci/obs-summary.sh

  verify_gates:
    name: Release gate contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost/chimeway_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache_main
        with:
          path: |
            deps
            _build
          key: build-test-gates-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            build-test-gates-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
      - run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      - name: Compile (instrumented — deps then app)
        shell: bash
        run: scripts/ci/obs-recompile.sh
      # The doc/release contract tests boot the :chimeway app (Repo + Oban), so a
      # Postgres service is required even though the assertions are file-content only.
      - run: mix ecto.create --quiet
      - run: mix ecto.migrate --quiet
      - run: mix ci.verify_contracts
      - name: CI observability summary
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          CACHE_MAIN_HIT: ${{ steps.cache_main.outputs.cache-hit }}
          CACHE_MAIN_MATCHED: ${{ steps.cache_main.outputs.cache-matched-key }}
          CACHE_MAIN_PRIMARY: ${{ steps.cache_main.outputs.cache-primary-key }}
        run: scripts/ci/obs-summary.sh

  verify_accrue_package:
    name: Packaged Accrue contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost/chimeway_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache_main
        with:
          path: |
            deps
            _build
          key: build-test-accrue-package-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            build-test-accrue-package-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
      - run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      - name: Compile (instrumented — deps then app)
        shell: bash
        run: scripts/ci/obs-recompile.sh
      - run: mix ecto.create --quiet
      - run: mix ecto.migrate --quiet
      - run: mix ci.verify_accrue_package
      - name: CI observability summary
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          CACHE_MAIN_HIT: ${{ steps.cache_main.outputs.cache-hit }}
          CACHE_MAIN_MATCHED: ${{ steps.cache_main.outputs.cache-matched-key }}
          CACHE_MAIN_PRIMARY: ${{ steps.cache_main.outputs.cache-primary-key }}
        run: scripts/ci/obs-summary.sh

  verify_docs:
    name: Docs build gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache_main
        with:
          path: |
            deps
            _build
          key: build-dev-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            build-dev-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
      - run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      - name: Compile (instrumented — deps then app)
        shell: bash
        run: scripts/ci/obs-recompile.sh
      - run: mix ci.docs
      - name: CI observability summary
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          CACHE_MAIN_HIT: ${{ steps.cache_main.outputs.cache-hit }}
          CACHE_MAIN_MATCHED: ${{ steps.cache_main.outputs.cache-matched-key }}
          CACHE_MAIN_PRIMARY: ${{ steps.cache_main.outputs.cache-primary-key }}
        run: scripts/ci/obs-summary.sh

  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    needs: [resolve_tiers]
    strategy:
      fail-fast: false
      matrix:
        elixir: ["1.19"]
        otp: ${{ fromJSON(needs.resolve_tiers.outputs.otp_matrix) }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost/chimeway_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        id: beam
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache_main
        with:
          path: |
            deps
            _build
          key: test-matrix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            test-matrix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-
      - run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      - name: Compile (instrumented — deps then app)
        shell: bash
        run: scripts/ci/obs-recompile.sh
      - run: mix ecto.create --quiet
      - run: mix ecto.migrate --quiet
      - run: mix ci.test
      - name: CI observability summary
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          CACHE_MAIN_HIT: ${{ steps.cache_main.outputs.cache-hit }}
          CACHE_MAIN_MATCHED: ${{ steps.cache_main.outputs.cache-matched-key }}
          CACHE_MAIN_PRIMARY: ${{ steps.cache_main.outputs.cache-primary-key }}
        run: scripts/ci/obs-summary.sh

  pr-gate:
    name: pr-gate
    runs-on: ubuntu-latest
    needs: [lint, test, verify_gates, verify_accrue_package, verify_docs, verify_adoption_paths]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify required PR lanes
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          VERIFY_GATES: ${{ needs.verify_gates.result }}
          VERIFY_ACCRUE_PACKAGE: ${{ needs.verify_accrue_package.result }}
          VERIFY_DOCS: ${{ needs.verify_docs.result }}
          VERIFY_ADOPTION_PATHS: ${{ needs.verify_adoption_paths.result }}
        run: scripts/ci/aggregate-gate.sh LINT TEST VERIFY_GATES VERIFY_ACCRUE_PACKAGE VERIFY_DOCS VERIFY_ADOPTION_PATHS

  verify_example:
    name: Example host + admin smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    if: github.event_name != 'pull_request'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost/chimeway_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache_main
        with:
          path: |
            deps
            _build
          key: build-test-example-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            build-test-example-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache_demo
        with:
          path: |
            examples/chimeway_demo_host/deps
            examples/chimeway_demo_host/_build
          key: ${{ runner.os }}-mix-demo-example-${{ hashFiles('examples/chimeway_demo_host/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-demo-example-
      - run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      - name: Compile (instrumented — deps then app)
        shell: bash
        run: scripts/ci/obs-recompile.sh
      - run: mix ecto.create --quiet
      - run: mix ecto.migrate --quiet
      # JOUR-05 (mix demo.up --check) cold-compiles the root + demo host in :dev
      # inside a 300s test. Pre-warm the :dev builds here so it runs warm.
      - name: Warm :dev build for JOUR-05 (mix demo.up --check)
        env:
          MIX_ENV: dev
        run: |
          mix deps.get
          mix compile
          cd examples/chimeway_demo_host && mix deps.get && mix compile
      - run: mix verify.example
      - name: CI observability summary
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          CACHE_MAIN_HIT: ${{ steps.cache_main.outputs.cache-hit }}
          CACHE_MAIN_MATCHED: ${{ steps.cache_main.outputs.cache-matched-key }}
          CACHE_MAIN_PRIMARY: ${{ steps.cache_main.outputs.cache-primary-key }}
          CACHE_DEMO_HIT: ${{ steps.cache_demo.outputs.cache-hit }}
          CACHE_DEMO_MATCHED: ${{ steps.cache_demo.outputs.cache-matched-key }}
          CACHE_DEMO_PRIMARY: ${{ steps.cache_demo.outputs.cache-primary-key }}
        run: scripts/ci/obs-summary.sh

  verify_runtime_prefix:
    name: Runtime prefix gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    if: github.event_name != 'pull_request'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost/chimeway_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache_main
        with:
          path: |
            deps
            _build
          key: build-test-runtime-prefix-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            build-test-runtime-prefix-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
      - run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      - name: Compile (instrumented — deps then app)
        shell: bash
        run: scripts/ci/obs-recompile.sh
      - run: mix ecto.create --quiet
      - run: mix ecto.migrate --quiet
      - run: mix verify.runtime_prefix
      - name: CI observability summary
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          CACHE_MAIN_HIT: ${{ steps.cache_main.outputs.cache-hit }}
          CACHE_MAIN_MATCHED: ${{ steps.cache_main.outputs.cache-matched-key }}
          CACHE_MAIN_PRIMARY: ${{ steps.cache_main.outputs.cache-primary-key }}
        run: scripts/ci/obs-summary.sh

  verify_journeys:
    name: TeamPulse consumer journeys
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    if: github.event_name != 'pull_request'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost/chimeway_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache_main
        with:
          path: |
            deps
            _build
          key: build-test-journeys-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            build-test-journeys-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache_demo
        with:
          path: |
            examples/chimeway_demo_host/deps
            examples/chimeway_demo_host/_build
          key: ${{ runner.os }}-mix-demo-journeys-${{ hashFiles('examples/chimeway_demo_host/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-demo-journeys-
      - run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      - name: Compile (instrumented — deps then app)
        shell: bash
        run: scripts/ci/obs-recompile.sh
      - run: mix ecto.create --quiet
      - run: mix ecto.migrate --quiet
      # JOUR-05 spawns `mix demo.up --check` in :dev, which cold-compiles the
      # root + demo host in :dev inside a 300s test. Pre-warm the :dev builds
      # here (outside the test's timeout) so the readiness check runs warm.
      - name: Warm :dev build for JOUR-05 (mix demo.up --check)
        env:
          MIX_ENV: dev
        run: |
          mix deps.get
          mix compile
          cd examples/chimeway_demo_host && mix deps.get && mix compile
      - run: mix verify.journeys
      - name: CI observability summary
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          CACHE_MAIN_HIT: ${{ steps.cache_main.outputs.cache-hit }}
          CACHE_MAIN_MATCHED: ${{ steps.cache_main.outputs.cache-matched-key }}
          CACHE_MAIN_PRIMARY: ${{ steps.cache_main.outputs.cache-primary-key }}
          CACHE_DEMO_HIT: ${{ steps.cache_demo.outputs.cache-hit }}
          CACHE_DEMO_MATCHED: ${{ steps.cache_demo.outputs.cache-matched-key }}
          CACHE_DEMO_PRIMARY: ${{ steps.cache_demo.outputs.cache-primary-key }}
        run: scripts/ci/obs-summary.sh

  verify_mailglass:
    name: Mailglass integration gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    if: github.event_name != 'pull_request'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      MIX_ENV: test
