name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    # Dispatched by release.yml when a Release PR is open but bot pushes skip pull_request CI.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Uniform Postgres credentials for every lane. Partner TestRepos
# (Mailglass/Accrue/Threadline/Sigra) derive their user/password from these
# PG* vars; lanes that set only DATABASE_URL previously left partner repos
# without credentials (username fell through to the runner's USER, password
# to nil), which failed on a clean CI run. Job-level env still overrides.
env:
  PGUSER: postgres
  PGPASSWORD: postgres
  PGHOST: localhost

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        with:
          elixir-version: "1.19"
          otp-version: "27"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-
      - run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      - run: mix ci.lint
      # Dependency advisory audit is ADVISORY-ONLY: it runs and surfaces new
      # advisories in the logs, but does not fail the gate. Blocking on
      # externally-disclosed CVEs with no upstream fix would wedge the entire
      # merge pipeline (lint feeds pr-gate). Accepted-risk advisories are
      # tracked in SECURITY.md; revisit when upstream patches ship.
      - name: Dependency advisory audit (advisory-only)
        run: mix ci.audit
        continue-on-error: true

  verify_gates:
    name: Release gate contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost/chimeway_test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        with:
          elixir-version: "1.19"
          otp-version: "27"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-verify-gates-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-verify-gates-
      - run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      # The doc/release contract tests boot the :chimeway app (Repo + Oban), so a
      # Postgres service is required even though the assertions are file-content only.
      - run: mix ecto.create --quiet
      - run: mix ecto.migrate --quiet
      - run: mix ci.verify_gates

  verify_docs:
    name: Docs build gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        with:
          elixir-version: "1.19"
          otp-version: "27"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-verify-docs-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-verify-docs-
      - run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      - run: mix ci.docs

  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        elixir: ["1.19"]
        otp: ["26", "27"]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost/chimeway_test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-
      - run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      - run: mix ecto.create --quiet
      - run: mix ecto.migrate --quiet
      - run: mix ci.test

  pr-gate:
    name: pr-gate
    runs-on: ubuntu-latest
    needs: [lint, test, verify_gates, verify_docs]
    if: always()
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Verify required PR lanes
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          VERIFY_GATES: ${{ needs.verify_gates.result }}
          VERIFY_DOCS: ${{ needs.verify_docs.result }}
        run: scripts/ci/aggregate-gate.sh LINT TEST VERIFY_GATES VERIFY_DOCS

  verify_example:
    name: Example host + admin smoke
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost/chimeway_test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        with:
          elixir-version: "1.19"
          otp-version: "27"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-verify-example-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-verify-example-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            examples/chimeway_demo_host/deps
            examples/chimeway_demo_host/_build
          key: ${{ runner.os }}-mix-demo-example-${{ hashFiles('examples/chimeway_demo_host/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-demo-example-
      - run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      - run: mix ecto.create --quiet
      - run: mix ecto.migrate --quiet
      - run: mix verify.example

  verify_runtime_prefix:
    name: Runtime prefix gate
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost/chimeway_test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        with:
          elixir-version: "1.19"
          otp-version: "27"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-verify-runtime-prefix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-verify-runtime-prefix-
      - run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      - run: mix ecto.create --quiet
      - run: mix ecto.migrate --quiet
      - run: mix verify.runtime_prefix

  verify_journeys:
    name: TeamPulse consumer journeys
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost/chimeway_test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        with:
          elixir-version: "1.19"
          otp-version: "27"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-verify-journeys-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-verify-journeys-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            examples/chimeway_demo_host/deps
            examples/chimeway_demo_host/_build
          key: ${{ runner.os }}-mix-demo-journeys-${{ hashFiles('examples/chimeway_demo_host/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-demo-journeys-
      - run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      - run: mix ecto.create --quiet
      - run: mix ecto.migrate --quiet
      - run: mix verify.journeys

  verify_mailglass:
    name: Mailglass integration gate
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost/chimeway_test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        with:
          elixir-version: "1.19"
          otp-version: "27"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-verify-mailglass-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-verify-mailglass-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            examples/chimeway_demo_host/deps
            examples/chimeway_demo_host/_build
          key: ${{ runner.os }}-mix-demo-mailglass-${{ hashFiles('examples/chimeway_demo_host/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-demo-mailglass-
      - run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      - run: mix ecto.create --quiet
      - run: mix ecto.migrate --quiet
      - run: mix verify.mailglass

  verify_accrue:
    name: Accrue dunning integration gate
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost/chimeway_test
      ACCRUE_PATH: ${{ github.workspace }}/accrue/accrue
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: szTheory/accrue
          ref: 236fa2f1649e771f3b515603495436badeed3c7b
          path: accrue/accrue
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        with:
          elixir-version: "1.19"
          otp-version: "27"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-verify-accrue-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-verify-accrue-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            examples/chimeway_demo_host/deps
            examples/chimeway_demo_host/_build
          key: ${{ runner.os }}-mix-demo-accrue-${{ hashFiles('examples/chimeway_demo_host/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-demo-accrue-
      - run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      # Compile the accrue path dep before ecto.create's deps-check runs; unlike
      # the hex dep used locally, the CI path dep isn't built by the implicit
      # ecto.create compile, causing "Unchecked dependencies: accrue not yet compiled".
      - run: mix deps.compile accrue --force
      - run: mix ecto.create --quiet
      - run: mix ecto.migrate --quiet
      - run: mix verify.accrue

  verify_inbox:
    name: Inbox integration gate
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost/chimeway_test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        with:
          elixir-version: "1.19"
          otp-version: "27"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-verify-inbox-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-verify-inbox-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            chimeway_inbox/deps
            chimeway_inbox/_build
          key: ${{ runner.os }}-mix-nested-inbox-${{ hashFiles('chimeway_inbox/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-nested-inbox-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            examples/chimeway_demo_host/deps
            examples/chimeway_demo_host/_build
          key: ${{ runner.os }}-mix-demo-inbox-${{ hashFiles('examples/chimeway_demo_host/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-demo-inbox-
      - run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      - run: mix ecto.create --quiet
      - run: mix ecto.migrate --quiet
      - run: mix verify.inbox

  verify_threadline:
    name: Threadline telemetry gate
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost/chimeway_test
      THREADLINE_PATH: ${{ github.workspace }}/threadline/threadline
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: szTheory/threadline
          ref: 46375fafc4df30fc916244ee4a21b7cae01f1ddc
          path: threadline/threadline
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        with:
          elixir-version: "1.19"
          otp-version: "27"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-verify-threadline-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-verify-threadline-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            examples/chimeway_demo_host/deps
            examples/chimeway_demo_host/_build
          key: ${{ runner.os }}-mix-demo-threadline-${{ hashFiles('examples/chimeway_demo_host/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-demo-threadline-
      - run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      - run: mix ecto.create --quiet
      - run: mix ecto.migrate --quiet
      - run: mix verify.threadline

  verify_sigra:
    name: Sigra auth integration gate
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost/chimeway_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
      CHIMEWAY_SKIP_ACCRUE_DEP: "1"
      CHIMEWAY_SKIP_THREADLINE_DEP: "1"
      SIGRA_PATH: ${{ github.workspace }}/sigra/sigra
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: szTheory/sigra
          ref: 62ceb46a38c4e617f6c06d874ecb12e1ab19d97c
          path: sigra/sigra
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        with:
          elixir-version: "1.19"
          otp-version: "27"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-verify-sigra-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-verify-sigra-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            examples/chimeway_demo_host/deps
            examples/chimeway_demo_host/_build
          key: ${{ runner.os }}-mix-demo-sigra-${{ hashFiles('examples/chimeway_demo_host/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-demo-sigra-
      - run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      - name: Prepare root test database
        run: |
          set -euo pipefail
          pg_isready -h localhost -p 5432 -U postgres
          timeout 600s mix ecto.create
          timeout 300s mix ecto.migrate
      - name: Run root Sigra proof lane
        shell: bash
        run: scripts/ci/sigra-proof.sh root
      - name: Run demo-host Sigra proof lane
        shell: bash
        run: scripts/ci/sigra-proof.sh demo
        env:
          SIGRA_PATH: ${{ github.workspace }}/sigra/sigra

  verify_admin:
    name: Admin integration gate
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost/chimeway_test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        with:
          elixir-version: "1.19"
          otp-version: "27"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-verify-admin-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-verify-admin-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            chimeway_admin/deps
            chimeway_admin/_build
          key: ${{ runner.os }}-mix-nested-admin-${{ hashFiles('chimeway_admin/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-nested-admin-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            examples/chimeway_demo_host/deps
            examples/chimeway_demo_host/_build
          key: ${{ runner.os }}-mix-demo-admin-${{ hashFiles('examples/chimeway_demo_host/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-demo-admin-
      - run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      - run: mix ecto.create --quiet
      - run: mix ecto.migrate --quiet
      - run: mix verify.admin

  install_golden_contract:
    name: Installer golden + prefix + DB migration contract
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost/chimeway_test
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Detect installer-related changes (PRs only)
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          scripts/ci/detect-installer-changes.sh "${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        if: steps.detect.outputs.run == 'true'
        with:
          elixir-version: "1.19"
          otp-version: "27"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.detect.outputs.run == 'true'
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-
      - run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
        if: steps.detect.outputs.run == 'true'
      - run: mix ecto.create --quiet
        if: steps.detect.outputs.run == 'true'
      - run: mix ecto.migrate --quiet
        if: steps.detect.outputs.run == 'true'
      - run: mix verify.install_golden
        if: steps.detect.outputs.run == 'true'

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    needs: [lint, test, verify_gates, verify_docs, verify_example, verify_runtime_prefix, verify_journeys, verify_mailglass, verify_accrue, verify_inbox, verify_threadline, verify_sigra, verify_admin, install_golden_contract]
    if: always() && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Verify required CI lanes
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          VERIFY_GATES: ${{ needs.verify_gates.result }}
          VERIFY_DOCS: ${{ needs.verify_docs.result }}
          VERIFY_EXAMPLE: ${{ needs.verify_example.result }}
          VERIFY_RUNTIME_PREFIX: ${{ needs.verify_runtime_prefix.result }}
          VERIFY_JOURNEYS: ${{ needs.verify_journeys.result }}
          VERIFY_MAILGLASS: ${{ needs.verify_mailglass.result }}
          VERIFY_ACCRUE: ${{ needs.verify_accrue.result }}
          VERIFY_INBOX: ${{ needs.verify_inbox.result }}
          VERIFY_THREADLINE: ${{ needs.verify_threadline.result }}
          VERIFY_SIGRA: ${{ needs.verify_sigra.result }}
          VERIFY_ADMIN: ${{ needs.verify_admin.result }}
          INSTALL_GOLDEN: ${{ needs.install_golden_contract.result }}
        run: scripts/ci/aggregate-gate.sh LINT TEST VERIFY_GATES VERIFY_DOCS VERIFY_EXAMPLE VERIFY_RUNTIME_PREFIX VERIFY_JOURNEYS VERIFY_MAILGLASS VERIFY_ACCRUE VERIFY_INBOX VERIFY_THREADLINE VERIFY_SIGRA VERIFY_ADMIN INSTALL_GOLDEN
