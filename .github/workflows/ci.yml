  verify_sigra:
    name: Sigra auth integration gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost/chimeway_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
      CHIMEWAY_SKIP_ACCRUE_DEP: "1"
      CHIMEWAY_SKIP_THREADLINE_DEP: "1"
      SIGRA_PATH: ${{ github.workspace }}/sigra/sigra
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: szTheory/sigra
          ref: 62ceb46a38c4e617f6c06d874ecb12e1ab19d97c
          path: sigra/sigra
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        with:
          elixir-version: "1.17"
          otp-version: "27"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-verify-sigra-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-verify-sigra-
      - run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      - name: Prepare root test database
        run: |
          set -euo pipefail
          pg_isready -h localhost -p 5432 -U postgres
          timeout 600s mix ecto.create
          timeout 300s mix ecto.migrate
      - name: Run root Sigra proof lane
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s elixir $(find _build/test/lib -type d -name ebin -print | sed 's/^/-pa /') test/support/sigra/ci_proof_runner.exs
        env:
          CHIMEWAY_FORCE_SIGRA_TEST_REPO_SETUP: "1"
          CHIMEWAY_MANUAL_REPO_START: "1"
          CHIMEWAY_SKIP_OBAN: "1"
      - name: Run demo-host Sigra proof lane
        run: |
          cd examples/chimeway_demo_host
          mix deps.get
          timeout 600s mix deps.compile
          timeout 300s mix compile
          timeout 300s mix test --no-compile test/demo_host_web/sigra_auth_proof_test.exs --only sigra --warnings-as-errors --trace
        env:
          CHIMEWAY_SKIP_THREADLINE_DEP: "1"
          CHIMEWAY_SKIP_MAILGLASS_DEP: "1"
          CHIMEWAY_SKIP_SIGRA_TRANSITIVE_DEP: "1"
          CHIMEWAY_PATH: ../..
          SIGRA_PATH: ${{ github.workspace }}/sigra/sigra

  install_golden_contract:
    name: Installer golden + idempotency contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Detect installer-related changes (PRs only)
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^priv/chimeway_migrations/|^lib/mix/tasks/chimeway\.gen\.migrations\.ex|^lib/chimeway/install/|^test/chimeway/install/|^test/fixtures/installer_golden/|^test/support/installer_fixture\.ex|^mix\.exs$|^\.github/workflows/ci\.yml$|^\.formatter\.exs$|^\.credo\.exs$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        if: steps.detect.outputs.run == 'true'
        with:
          elixir-version: "1.17"
          otp-version: "27"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.detect.outputs.run == 'true'
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-
      - run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
        if: steps.detect.outputs.run == 'true'
      - run: mix ci.install_golden
        if: steps.detect.outputs.run == 'true'
        env:
          MIX_ENV: test

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    needs: [lint, test, verify_gates, verify_docs, verify_example, verify_journeys, verify_mailglass, verify_accrue, verify_inbox, verify_threadline, verify_sigra]
    if: always()
    steps:
      - name: Verify required CI lanes
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          VERIFY_GATES: ${{ needs.verify_gates.result }}
          VERIFY_DOCS: ${{ needs.verify_docs.result }}
          VERIFY_EXAMPLE: ${{ needs.verify_example.result }}
          VERIFY_JOURNEYS: ${{ needs.verify_journeys.result }}
          VERIFY_MAILGLASS: ${{ needs.verify_mailglass.result }}
          VERIFY_ACCRUE: ${{ needs.verify_accrue.result }}
          VERIFY_INBOX: ${{ needs.verify_inbox.result }}
          VERIFY_THREADLINE: ${{ needs.verify_threadline.result }}
          VERIFY_SIGRA: ${{ needs.verify_sigra.result }}
        run: |
          set -euo pipefail
          failed=0
          for lane in LINT TEST VERIFY_GATES VERIFY_DOCS VERIFY_EXAMPLE VERIFY_JOURNEYS VERIFY_MAILGLASS VERIFY_ACCRUE VERIFY_INBOX VERIFY_THREADLINE VERIFY_SIGRA; do
            result="${!lane}"
            if [[ "$result" != "success" ]]; then
              echo "Required lane $lane: $result"
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "ci-gate failed: one or more required lanes did not succeed."
            exit 1
          fi
          echo "ci-gate passed: all required lanes succeeded."
