    name: Installer golden + prefix + DB migration contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    if: github.event_name != 'pull_request'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost/chimeway_test
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Detect installer-related changes (PRs only)
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          scripts/ci/detect-installer-changes.sh "${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        id: beam
        if: steps.detect.outputs.run == 'true'
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache_main
        if: steps.detect.outputs.run == 'true'
        with:
          path: |
            deps
            _build
          key: build-test-install-golden-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            build-test-install-golden-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
      - run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
        if: steps.detect.outputs.run == 'true'
      - name: Compile (instrumented — deps then app)
        if: steps.detect.outputs.run == 'true'
        shell: bash
        run: scripts/ci/obs-recompile.sh
      # CACHE-03 / D-13: surface the compile-warnings gate as its own fast step
      # on already-warm artifacts, so the Phase-87 timing summary shows
      # ecto.create as a fast DB-only step instead of a disguised ~135s compile.
      # This literal flag lives ONLY here — never in shared obs-recompile.sh.
      - run: mix compile --warnings-as-errors
        if: steps.detect.outputs.run == 'true'
      - run: mix ecto.create --quiet
        if: steps.detect.outputs.run == 'true'
      - run: mix ecto.migrate --quiet
        if: steps.detect.outputs.run == 'true'
      - run: mix verify.install_golden
        if: steps.detect.outputs.run == 'true'
      - name: CI observability summary
        if: always() && steps.detect.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          CACHE_MAIN_HIT: ${{ steps.cache_main.outputs.cache-hit }}
          CACHE_MAIN_MATCHED: ${{ steps.cache_main.outputs.cache-matched-key }}
          CACHE_MAIN_PRIMARY: ${{ steps.cache_main.outputs.cache-primary-key }}
        run: scripts/ci/obs-summary.sh

  verify_adoption_paths:
    name: Adoption proof paths
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost/chimeway_test
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache_main
        with:
          path: |
            deps
            _build
          key: build-test-adoption-paths-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            build-test-adoption-paths-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
      - run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      - name: Compile (instrumented — deps then app)
        shell: bash
        run: scripts/ci/obs-recompile.sh
      - run: mix compile --warnings-as-errors
      - run: mix ecto.create --quiet
      - run: mix ecto.migrate --quiet
      - name: Run adoption proof paths
        run: mix verify.adoption_paths
      - name: CI observability summary
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          CACHE_MAIN_HIT: ${{ steps.cache_main.outputs.cache-hit }}
          CACHE_MAIN_MATCHED: ${{ steps.cache_main.outputs.cache-matched-key }}
          CACHE_MAIN_PRIMARY: ${{ steps.cache_main.outputs.cache-primary-key }}
        run: scripts/ci/obs-summary.sh

  nightly_cold_build:
    name: Nightly cold build (cache-correctness backstop)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    needs: [resolve_tiers]
    if: needs.resolve_tiers.outputs.run_nightly == 'true'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost/chimeway_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict
      # NOTE: deliberately NO dependency/build cache step here — this is the
      # whole point of the cold-build backstop (TIER-01). Every dep is fetched
      # and every module compiled from nothing, so a cache-key correctness bug
      # can never hide behind a restored cache on this lane. This job design
      # cannot satisfy the shared @build_lanes "carries a cache id" invariant and
      # is exempt from it by contract (see ci_observability_contract_test.exs).
      - run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix ecto.create --quiet
      - run: mix ecto.migrate --quiet
      - run: mix ci.test
      - name: CI observability summary
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: scripts/ci/obs-summary.sh

  test_floor_1_17:
    name: Test (Elixir 1.17 floor / OTP 27)
    runs-on: ubuntu-latest
    needs: [resolve_tiers]
    if: needs.resolve_tiers.outputs.run_floor == 'true'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost/chimeway_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        id: beam
        with:
          elixir-version: "1.17"
          otp-version: "27"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache_main
        with:
          path: |
            deps
            _build
          key: test-floor-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            test-floor-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
      - run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix ecto.create --quiet
      - run: mix ecto.migrate --quiet
      - run: mix ci.test

  # test_seed_zero (REL-03): nightly-only ordering guard. Runs the exact same
  # default suite as `mix ci.test` but with a fixed `--seed 0` instead of the
  # random ExUnit seed every PR/push run uses, so a test-ordering coupling
  # (like the Phase 89 CONC-04 shakeout) is caught going forward without
  # green-washing it behind a permanently pinned seed on the main paths.
  test_seed_zero:
    name: Test ordering guard (--seed 0)
    runs-on: ubuntu-latest
    needs: [resolve_tiers]
    if: needs.resolve_tiers.outputs.run_nightly == 'true'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost/chimeway_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache_main
        with:
          path: |
            deps
            _build
          key: test-seed-zero-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            test-seed-zero-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
      - run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix ecto.create --quiet
      - run: mix ecto.migrate --quiet
      - run: mix test --seed 0 --exclude mailglass --exclude accrue --exclude threadline --exclude sigra --warnings-as-errors

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    needs: [lint, test, verify_gates, verify_accrue_package, verify_docs, verify_example, verify_runtime_prefix, verify_journeys, verify_mailglass, verify_accrue, verify_inbox, verify_threadline, verify_sigra, install_golden_contract, verify_adoption_paths, test_floor_1_17]
    if: always() && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify required CI lanes
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          VERIFY_GATES: ${{ needs.verify_gates.result }}
          VERIFY_ACCRUE_PACKAGE: ${{ needs.verify_accrue_package.result }}
          VERIFY_DOCS: ${{ needs.verify_docs.result }}
          VERIFY_EXAMPLE: ${{ needs.verify_example.result }}
          VERIFY_RUNTIME_PREFIX: ${{ needs.verify_runtime_prefix.result }}
          VERIFY_JOURNEYS: ${{ needs.verify_journeys.result }}
          VERIFY_MAILGLASS: ${{ needs.verify_mailglass.result }}
          VERIFY_ACCRUE: ${{ needs.verify_accrue.result }}
          VERIFY_INBOX: ${{ needs.verify_inbox.result }}
          VERIFY_THREADLINE: ${{ needs.verify_threadline.result }}
          VERIFY_SIGRA: ${{ needs.verify_sigra.result }}
          INSTALL_GOLDEN: ${{ needs.install_golden_contract.result }}
          VERIFY_ADOPTION_PATHS: ${{ needs.verify_adoption_paths.result }}
          TEST_FLOOR_1_17: ${{ needs.test_floor_1_17.result }}
        run: scripts/ci/aggregate-gate.sh LINT TEST VERIFY_GATES VERIFY_ACCRUE_PACKAGE VERIFY_DOCS VERIFY_EXAMPLE VERIFY_RUNTIME_PREFIX VERIFY_JOURNEYS VERIFY_MAILGLASS VERIFY_ACCRUE VERIFY_INBOX VERIFY_THREADLINE VERIFY_SIGRA INSTALL_GOLDEN VERIFY_ADOPTION_PATHS TEST_FLOOR_1_17

  # nightly-gate mirrors ci-gate's aggregate pass/fail contract, scoped to
  # exactly the relocated/nightly-composition lanes (TIER-04). It gives a
  # maintainer one job to check for "is the nightly tier green." `test` is
  # intentionally a needs: target of BOTH ci-gate and this gate — a job can gate
  # more than one aggregator. Kept LAST in the file so its block extraction is
  # bounded cleanly at end-of-file. Do NOT add these nightly jobs to ci-gate.
  nightly-gate:
    name: nightly-gate
    runs-on: ubuntu-latest
    needs: [resolve_tiers, nightly_cold_build, test, test_floor_1_17, verify_admin, test_seed_zero]
    if: always() && needs.resolve_tiers.outputs.run_nightly == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify required nightly lanes
        env:
          NIGHTLY_COLD_BUILD: ${{ needs.nightly_cold_build.result }}
          TEST: ${{ needs.test.result }}
          TEST_FLOOR_1_17: ${{ needs.test_floor_1_17.result }}
          VERIFY_ADMIN: ${{ needs.verify_admin.result }}
          TEST_SEED_ZERO: ${{ needs.test_seed_zero.result }}
        run: scripts/ci/aggregate-gate.sh NIGHTLY_COLD_BUILD TEST TEST_FLOOR_1_17 VERIFY_ADMIN TEST_SEED_ZERO
