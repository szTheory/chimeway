# Release Please opens/updates a Release PR from conventional commits on main.
# When that PR is merged, Release Please creates the GitHub Release + v* tag,
# gate-ci-green verifies CI passed on the release SHA, then publish-hex publishes
# to Hex with HEX_API_KEY.
#
# Requires repository secret: HEX_API_KEY (Actions secrets).
# RELEASE_PLEASE_TOKEN: optional fine-grained PAT for GitHub release creation and
# native pull_request CI on Release Please PRs (GITHUB_TOKEN fallback per D-60.1-11).

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      prs_created: ${{ steps.release.outputs.prs_created }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      # Skip reruns when a merged release PR was already tagged (manual recovery
      # or duplicate workflow dispatch after v* exists on GitHub).
      - name: Detect already-tagged release PR
        id: release-preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          pr_number=""
          if [[ "${COMMIT_MESSAGE:-}" =~ Merge\ pull\ request\ #([0-9]+) ]]; then
            pr_number="${BASH_REMATCH[1]}"
          fi

          if [ -z "$pr_number" ]; then
            echo "No merge PR number in head commit; running release-please."
            echo "should_run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          labels=$(gh pr view "$pr_number" --json labels --jq '.labels[].name' 2>/dev/null || true)
          if grep -qx 'autorelease: tagged' <<<"$labels"; then
            echo "Release PR #$pr_number is already tagged; skipping release-please rerun."
            echo "should_run=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # Merged release PR but tag may already exist from manual recovery — skip
          # duplicate tag creation only on release-PR merges, not on every push.
          expected_tag="v$(jq -r '.["."]' .release-please-manifest.json)"
          if gh release view "$expected_tag" >/dev/null 2>&1; then
            echo "GitHub release $expected_tag already exists for merged PR; skipping rerun."
            echo "should_run=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Release PR #$pr_number not fully published yet; running release-please."
          echo "should_run=true" >>"$GITHUB_OUTPUT"

      - name: Run Release Please
        id: release
        if: ${{ steps.release-preflight.outputs.should_run == 'true' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  bootstrap-release-pr-ci:
    name: Bootstrap CI on Release PR
    runs-on: ubuntu-latest
    needs: release-please
    if: always() && needs.release-please.result == 'success'
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Dispatch CI when release PR is open or updated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRS_CREATED: ${{ needs.release-please.outputs.prs_created }}
        run: |
          set -euo pipefail

          open_count=$(gh pr list \
            --head release-please--branches--main \
            --state open \
            --label "autorelease: pending" \
            --json number \
            -R "${{ github.repository }}" | jq 'length')

          if [ "${PRS_CREATED:-false}" = "true" ]; then
            echo "Release Please updated the PR — pull_request CI runs via RELEASE_PLEASE_TOKEN; skipping workflow_dispatch."
          elif [ "$open_count" -gt 0 ]; then
            echo "Open release PR without a fresh Release Please update — dispatching CI (open=$open_count)"
            gh workflow run ci.yml --ref release-please--branches--main -R "${{ github.repository }}"
          else
            echo "No open release PR — skipping CI bootstrap."
          fi

  gate-ci-green:
    name: Verify CI is green on release SHA
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - name: Resolve tagged SHA
        id: resolve-sha
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const tag = '${{ needs.release-please.outputs.tag_name }}';
            const shaFromRelease = '${{ needs.release-please.outputs.sha }}';

            if (shaFromRelease) {
              core.setOutput('sha', shaFromRelease);
              return;
            }

            const commit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${tag}`
            });
            core.setOutput('sha', commit.data.sha);

      - name: Wait for ci-gate on release SHA
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            // Release Please tags main immediately; ci.yml often has not started yet.
            // Poll until ci-gate succeeds. Ignore stale cancelled/failed runs from merge
            // push races — a fresh run may start after the tag lands.
            const sha = '${{ steps.resolve-sha.outputs.sha }}';
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const maxAttempts = 60;
            const waitMs = 30000;
            let lastRunUrl = '';
            let ciDispatched = false;
            const tag = '${{ needs.release-please.outputs.tag_name }}';

            async function ciGateForRun(runId) {
              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: runId,
                  per_page: 100
                }
              );
              return jobs.find((job) => job.name === 'ci-gate');
            }

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                head_sha: sha,
                per_page: 20
              });

              const runs = data.workflow_runs
                .filter((run) => run.head_sha === sha)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              if (runs.length === 0) {
                core.info(`No ci.yml run yet for ${sha} (${attempt}/${maxAttempts}).`);
                if (attempt === 3 && !ciDispatched && tag) {
                  await github.rest.actions.createWorkflowDispatch({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id: 'ci.yml',
                    ref: tag
                  });
                  ciDispatched = true;
                  core.info(`Dispatched ci.yml on tag ${tag} for release SHA ${sha}.`);
                }
                await sleep(waitMs);
                continue;
              }

              lastRunUrl = runs[0].html_url;

              if (runs.some((run) => run.status !== 'completed')) {
                const inProgress = runs.find((run) => run.status !== 'completed');
                core.info(
                  `ci.yml ${inProgress.status} for ${sha} (${attempt}/${maxAttempts}): ${inProgress.html_url}`
                );
                await sleep(waitMs);
                continue;
              }

              for (const run of runs) {
                const ciGate = await ciGateForRun(run.id);

                if (!ciGate) {
                  core.info(`ci-gate job not found in run ${run.html_url}; checking other runs.`);
                  continue;
                }

                if (ciGate.conclusion === 'success') {
                  core.info(`ci-gate succeeded on release SHA ${sha}: ${run.html_url}`);
                  return;
                }
              }

              core.info(
                `No successful ci-gate yet for ${sha} (${attempt}/${maxAttempts}); waiting for a fresh run.`
              );
              await sleep(waitMs);
            }

            core.setFailed(
              `Timed out waiting for ci-gate on SHA ${sha} after ${maxAttempts} attempts (~${(maxAttempts * waitMs) / 60000} min). ` +
              `Last run: ${lastRunUrl || 'none'}`
            );

  publish-hex:
    name: Publish to Hex.pm
    runs-on: ubuntu-latest
    needs: [release-please, gate-ci-green]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - name: Cache library deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-library-${{ hashFiles('mix.lock') }}

      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch library deps
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Verify release version in mix.exs
        run: grep -n "@version \"${RELEASE_VERSION}\"" mix.exs

      - name: Pre-publish gate replay
        env:
          # File-content gates run under :test; the docs build runs under :dev
          # (where ex_doc lives). This job has no Postgres, so skip Oban and the
          # partner TestRepo provisioning — otherwise Oban.verify_migrated! /
          # storage_up hit DBConnection errors. Docs need no DB (mirrors verify_docs).
          CHIMEWAY_SKIP_OBAN: "1"
          CHIMEWAY_SKIP_PARTNER_TEST_REPOS: "1"
        run: |
          env MIX_ENV=test mix ci.verify_gates
          env MIX_ENV=dev mix ci.docs

      - name: Build Hex package
        # Runs in :dev (default). sigra_dep/0 no longer uses `override: true`
        # (sigra ~> 1.0 matches mailglass), so Hex no longer rejects the build, and
        # :dev is where ex_doc lives to build docs for `mix hex.publish`.
        run: mix hex.build

      - name: Skip if version already on Hex
        id: idempotency
        run: |
          if mix hex.info chimeway "${RELEASE_VERSION}" 2>/dev/null | grep -q "Released:"; then
            echo "Version ${RELEASE_VERSION} of chimeway already on Hex — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry run Hex publish
        if: steps.idempotency.outputs.skip != 'true'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --dry-run --yes

      - name: Publish to Hex
        if: steps.idempotency.outputs.skip != 'true'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes

      - name: Verify version on Hex.pm
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if curl -fsS "https://hex.pm/api/packages/chimeway/releases/${RELEASE_VERSION}" | grep -q "\"version\""; then
              echo "Hex.pm lists chimeway ${RELEASE_VERSION}"
              exit 0
            fi
            echo "waiting for Hex index... (${i}/36)"
            sleep 10
          done
          echo "Timed out waiting for https://hex.pm/api/packages/chimeway/releases/${RELEASE_VERSION}"
          exit 1
